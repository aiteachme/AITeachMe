name: remember_info
description: 记住关于用户的一条信息（学习偏好、强弱项、背景等）
version: "1.0"
category: 记忆
enabled: true
parameters:
  content:
    type: string
    description: 要记住的信息内容
    required: true
  tag:
    type: string
    description: 记忆标签（preference/strength/weakness/background/note）
    default: general
  importance:
    type: number
    description: 重要度（0.0 ~ 1.0）
    default: 0.5
