name: search_kb
description: 在用户上传的知识库中检索与问题相关的知识片段
version: "1.0"
category: 检索
enabled: true
parameters:
  query:
    type: string
    description: 搜索查询（自然语言）
    required: true
  subject:
    type: string
    description: 学科标识
    required: true
  top_k:
    type: integer
    description: 返回结果数量
    default: 5
