[project]
name = "aiteachme-backend"
version = "0.0.9"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "alembic>=1.13.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlmodel>=0.0.19",
    "nanoid>=2.0.0",
    "pysqlite3-binary>=0.5.4; platform_system == 'Linux'",
    "sqlite-vec>=0.1.1",
    "litellm>=1.83.14",
    "instructor>=1.3.0",
    "langgraph>=0.1.0",
    "langsmith>=0.7.31",
    "httpx>=0.28.0",
    "aiohttp>=3.13.4",
    "beautifulsoup4>=4.14.0",
    "Jinja2>=3.1.0",
    "lxml>=6.1.0",
    "markdown-it-py>=4.0.0",
    "mammoth>=1.11.0",
    "Pillow>=12.0.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.2.2",
    "structlog>=24.1.0",
    "python-multipart>=0.0.27",
    "aiofiles>=23.2.1",
    "requests>=2.32.0",
    "cryptography>=46.0.7",
    "llama-index-core>=0.12.0",
]

[project.optional-dependencies]
cloud = [
    "asyncpg>=0.29.0",
    "boto3>=1.34.0",
    "psycopg[binary]>=3.1.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.3.0",
    "llama-index-vector-stores-postgres>=0.4.0",
]
dev = [
    "coverage[toml]>=7.6.0",
    "pytest>=9.0.0",
    "langgraph-cli[inmem]>=0.4.19",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--basetemp=pytest-tmp",
]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
