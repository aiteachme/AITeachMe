[project]
name = "aiteachme-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlmodel>=0.0.19",
    "nanoid>=2.0.0",
    "pysqlite3-binary>=0.5.4; platform_system == 'Linux'",
    "sqlite-vec>=0.1.1",
    "litellm>=1.40.0",
    "instructor>=1.3.0",
    "langgraph>=0.1.0",
    "langgraph-cli[inmem]>=0.4.19",
    "langsmith>=0.7.0",
    "Jinja2>=3.1.0",
    "markitdown[all]>=0.0.1",
    "pymupdf4llm>=0.0.5",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.1",
    "psycopg[binary]>=3.1.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.3.0",
    "boto3>=1.34.0",
    "requests>=2.32.0",
    "llama-index-core>=0.12.0",
    "llama-index-vector-stores-postgres>=0.4.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
