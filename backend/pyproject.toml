[project]
name = "aiteachme-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlmodel>=0.0.19",
    "sqlite-vec>=0.1.1",
    "litellm>=1.40.0",
    "instructor>=1.3.0",
    "langgraph>=0.1.0",
    "markitdown>=0.0.1",
    "pymupdf4llm>=0.0.5",
    "pydantic-settings>=2.2.0",
    "structlog>=24.1.0",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

