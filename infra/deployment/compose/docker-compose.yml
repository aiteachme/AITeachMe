version: '3.8'

services:
  backend:
    build:
      context: ../../..
      dockerfile: infra/deployment/docker/backend.Dockerfile
    container_name: aiteachme-backend
    ports:
      - "9020:9020"
    volumes:
      - ../../backend:/app
      - ../../models:/app/models
      - ../../datasets:/app/datasets
      - ../../configs:/app/configs
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: ../../..
      dockerfile: infra/deployment/docker/frontend.Dockerfile
    container_name: aiteachme-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
