map $http_upgrade $connection_upgrade {
    default upgrade;
    "" "";
}

map $uri $aiteachme_safe_request_uri {
    ~*cshr_[^/?]+.*cshr_ /:redacted;
    ~^/api/v1/course-shares/cshr_[^/?]+(?<share_api_suffix>/.*)?$ /api/v1/course-shares/:shareToken$share_api_suffix;
    ~^/share/courses/cshr_[^/?]+(?<share_page_suffix>/.*)?$ /share/courses/:shareToken$share_page_suffix;
    ~*cshr_ /:redacted;
    default $uri;
}

map $http_referer $aiteachme_safe_referer {
    ~*cshr_ "-";
    default $http_referer;
}

map $http_user_agent $aiteachme_safe_user_agent {
    ~*cshr_ "-";
    default $http_user_agent;
}

log_format aiteachme_safe '$remote_addr - $remote_user [$time_local] '
                          '"$request_method $aiteachme_safe_request_uri $server_protocol" '
                          '$status $body_bytes_sent "$aiteachme_safe_referer" "$aiteachme_safe_user_agent"';

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log aiteachme_safe;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/css
        text/plain
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    location /assets/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~ ^/.+/assets/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /index.html {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
    }

    location = /runtime-config.js {
        try_files /runtime-config.js =404;
        add_header Cache-Control "no-cache" always;
    }

    location ~ ^/.+/runtime-config\.js$ {
        try_files /runtime-config.js =404;
        add_header Cache-Control "no-cache" always;
    }

    location /_next/static/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /screenshots/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /docs/api/search {
        default_type application/json;
        try_files /docs/api/search =404;
        add_header Cache-Control "no-cache" always;
    }

    location /docs/ {
        try_files $uri $uri/index.html $uri.html =404;
        add_header Cache-Control "no-cache" always;
    }

    location = /docs {
        try_files /docs/index.html =404;
        add_header Cache-Control "no-cache" always;
    }

    location = /api/v1/files/upload {
        # Transport ceiling only; backend settings enforce the actual upload limit.
        client_max_body_size 260m;
        proxy_pass http://backend:9020;
        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600;
        gzip off;
    }

    location ~ ^/api/v1/courses/[^/]+/files/upload$ {
        # Transport ceiling only; backend settings enforce the actual upload limit.
        client_max_body_size 260m;
        proxy_pass http://backend:9020;
        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600;
        gzip off;
    }

    location = /api/v1/courses/import {
        # Allow multipart overhead; backend enforces 256 MB .atmx package bytes.
        client_max_body_size 260m;
        proxy_pass http://backend:9020;
        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600;
        gzip off;
    }

    location /api {
        proxy_pass http://backend:9020;
        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600;
        gzip off;
    }

    location = /openapi.json {
        proxy_pass http://backend:9020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600;
        gzip off;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
