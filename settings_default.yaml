# 项目级运行配置。
# 密钥、连接串、SMTP、对象存储、LangSmith 等环境相关参数放 `.env` / 进程环境变量。

models:
  # 三层模型策略：
  # reason  - 推理模型，深度推理和规划；留空则回退到 primary。
  # primary - 常用模型，教学、出题、批改、对话。
  # light   - 轻量模型，批量抽取、分类、摘要；留空则回退到 primary。

  # reason: qwen3-max
  # primary: qwen-plus-latest
  # light: qwen-flash

  reason: qwen-flash
  primary: qwen-flash
  light: qwen-flash

  # reason: qwen-turbo
  # primary: qwen-turbo
  # light: qwen-turbo
  extract: ""
  ocr: ""
  embedding: text-embedding-v4
  # embedding: ""
  image_generation: ""
  mermaid_generation: qwen-plus-latest
  overrides: {}

files:
  max_upload_size_mb: 10
  max_files_per_upload: 10

chat:
  history_turns: 10

planner:
  default_digest_mode: sprint
  default_tone: encouraging
  sprint:
    min_chapters: 3
    max_chapters: 6
    target_length: "3000-5000字"
  systematic:
    min_chapters: 5
    max_chapters: 12
    target_length: "10000-15000字"

docgen:
  allow_external_search: true
  max_parallel_chapters: 20
  io_parallelism: 20
  max_research_queries: 3
  retrieval_timeout_s: 18.0
  read_timeout_s: 12.0

ingest:
  parse_concurrency: 5
  parser_timeout_s: 90

rag:
  top_k: 5
  similarity_threshold: 0.3
  rerank_model: ""
  rerank_top_k: 3

search:
  max_results_per_query: 5
  scrape_timeout_s: 20
  provider_timeout_s: 6.0
  total_timeout_s: 12.0
  read_timeout_s: 10.0
  parallel_retrievers: true
  max_parallel_retrievers: 4
  fusion_k: 60
  runtime_cache_enabled: true
  runtime_cache_ttl_s: 900
  runtime_cache_max_entries: 256
  searxng_base_url: ""
  # retriever_profiles:
  #   planner_grounding: [local_rag, bocha, wikipedia, baidu_baike, zhihu, arxiv, semantic_scholar, duckduckgo]
  #   docgen_systematic: [local_rag, tavily, bocha, brave, exa, bing, wikipedia, arxiv, semantic_scholar, duckduckgo]

web_search:
  retriever: duckduckgo
  retrievers: ""
  retriever_profile: ""

local_rag:
  priority: true
  min_results: 2

runtime:
  llm_concurrency_limit: 20
  default_token_budget: 4000

embedding:
  batch_size: 10
  batch_delay_s: 0.1

digest:
  timing_top_k: 5
  token_summary_enabled: true
  chapter_priors_timeout_ms: 0

knowledge_graph:
  extract_max_parallelism: 20

observability:
  llm_observability_enabled: true
  tracing_enabled: true
  langsmith_max_text_chars: 2000
  llm_observability_max_records: 5000

safety:
  guardrails_enabled: true

cache:
  enabled: false
  ttl_s: 3600
  max_entries: 1000

generation:
  enable_image_generation: false
  enable_mermaid_generation: true
