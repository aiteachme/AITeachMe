<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <title>AiTeachMe - &#26234;&#33021;&#23398;&#20064;&#24179;&#21488;</title>
  <meta name="description" content="AiTeachMe - AI-powered learning platform" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <script>
    if (window.electronWindow) {
      document.documentElement.classList.add("is-desktop-shell");
    }
  </script>
  <style>
    html,
    body,
    #app {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      background: #fafafa;
      color: #1f2329;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
    }

    .startup-shell {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 100%;
      background:
        linear-gradient(135deg, rgba(99, 102, 241, 0.13) 0%, rgba(139, 92, 246, 0.08) 28%, rgba(255, 255, 255, 0) 58%),
        linear-gradient(315deg, rgba(14, 165, 233, 0.07) 0%, rgba(255, 255, 255, 0) 45%),
        linear-gradient(180deg, #ffffff 0%, #fafafa 46%, #f4f5f8 100%);
    }

    .is-desktop-shell .startup-shell {
      grid-template-rows: minmax(0, 1fr);
      place-items: center;
    }

    .startup-titlebar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: none;
      align-items: center;
      height: 40px;
      min-height: 40px;
      background: transparent;
      user-select: none;
      -webkit-app-region: drag;
    }

    .dark .startup-titlebar {
      background: transparent;
      color: #e2e8f0;
    }

    .is-desktop-shell .startup-titlebar {
      display: flex;
    }

    .startup-nav-controls {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 4px;
      height: 100%;
      padding-left: 8px;
      -webkit-app-region: no-drag;
    }

    .startup-icon {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .startup-icon-small {
      width: 14px;
      height: 14px;
    }

    .startup-restore-icon {
      display: none;
    }

    .is-window-maximized .startup-maximize-icon {
      display: none;
    }

    .is-window-maximized .startup-restore-icon {
      display: block;
    }

    .startup-titlebar-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: #64748b;
      font: inherit;
      line-height: 1;
      transition: background-color 120ms ease, color 120ms ease, opacity 120ms ease;
      -webkit-app-region: no-drag;
    }

    .startup-titlebar-button:hover {
      background: rgba(15, 23, 42, 0.045);
      color: #1f2937;
    }

    .startup-titlebar-button:disabled {
      pointer-events: none;
      opacity: 0.35;
    }

    .dark .startup-titlebar-button {
      color: #94a3b8;
    }

    .dark .startup-titlebar-button:hover {
      background: rgba(255, 255, 255, 0.07);
      color: #f1f5f9;
    }

    .startup-window-controls {
      display: flex;
      height: 100%;
      -webkit-app-region: no-drag;
    }

    .startup-drag-region {
      flex: 1 1 auto;
      align-self: stretch;
      min-width: 16px;
      -webkit-app-region: drag;
    }

    .startup-window-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 100%;
      border: 0;
      background: transparent;
      color: #475569;
      font: inherit;
      line-height: 1;
      transition: background-color 120ms ease, color 120ms ease;
      -webkit-app-region: no-drag;
    }

    .startup-window-button:hover {
      background: rgba(15, 23, 42, 0.045);
    }

    .startup-window-button.close:hover {
      background: #ef4444;
      color: #ffffff;
    }

    .dark .startup-window-button {
      color: #cbd5e1;
    }

    .dark .startup-window-button:hover {
      background: rgba(255, 255, 255, 0.07);
    }

    .startup-content {
      display: grid;
      place-items: center;
      min-height: 100%;
    }

    .is-desktop-shell .startup-content {
      min-height: 0;
    }

    .startup-panel {
      display: grid;
      justify-items: center;
      gap: 10px;
      color: #1f2329;
    }

    .startup-hero {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 130px;
      height: 120px;
      margin-bottom: -2px;
      animation: startup-hero-float 2.7s ease-in-out infinite;
    }

    .startup-hero::before {
      position: absolute;
      inset: -20%;
      content: "";
      border-radius: 999px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.18) 0%, rgba(139, 92, 246, 0.08) 50%, transparent 70%);
      pointer-events: none;
      animation: startup-hero-glow 1.7s ease-in-out infinite;
    }

    .startup-hero-svg {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 4px 20px rgba(99, 102, 241, 0.2));
    }

    .startup-sparkle {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 0;
      width: 3px;
      height: 3px;
      border-radius: 999px;
      background: #818cf8;
      pointer-events: none;
      animation: startup-sparkle 1.35s ease-in-out infinite;
    }

    .startup-sparkle:nth-of-type(1) {
      --sparkle-x: 55px;
      --sparkle-y: 0px;
    }

    .startup-sparkle:nth-of-type(2) {
      --sparkle-x: 17px;
      --sparkle-y: 52px;
      width: 2px;
      height: 2px;
      background: #a78bfa;
      animation-delay: 0.18s;
      animation-duration: 1.5s;
    }

    .startup-sparkle:nth-of-type(3) {
      --sparkle-x: -44px;
      --sparkle-y: 32px;
      background: #c4b5fd;
      animation-delay: 0.36s;
      animation-duration: 1.65s;
    }

    .startup-sparkle:nth-of-type(4) {
      --sparkle-x: -44px;
      --sparkle-y: -32px;
      width: 2px;
      height: 2px;
      background: #818cf8;
      animation-delay: 0.54s;
      animation-duration: 1.8s;
    }

    .startup-sparkle:nth-of-type(5) {
      --sparkle-x: 17px;
      --sparkle-y: -52px;
      background: #a78bfa;
      animation-delay: 0.72s;
      animation-duration: 1.95s;
    }

    .startup-draw-path {
      fill: none;
      stroke: url(#startup-stroke-grad);
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-opacity: 1;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: startup-logo-draw 1.8s ease-in-out forwards;
    }

    .startup-fill-path {
      fill: #0b0c0b;
      fill-opacity: 0;
      stroke: none;
      animation: startup-logo-fill 0.42s ease-out forwards;
    }

    .startup-fill-pop {
      fill: #0b0c0b;
      stroke: none;
      opacity: 0;
      transform: scale(0);
      transform-box: fill-box;
      transform-origin: center;
      animation: startup-logo-pop 0.28s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .dark .startup-fill-path,
    .dark .startup-fill-pop {
      fill: #f1f5f9;
    }

    .startup-title {
      margin: 0;
      font-size: 20px;
      font-weight: 650;
      line-height: 1.25;
    }

    .startup-status {
      margin: 0;
      color: #646a73;
      font-size: 13px;
      line-height: 1.5;
    }

    .startup-progress {
      position: relative;
      width: 168px;
      height: 3px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(99, 102, 241, 0.14);
    }

    .startup-progress::after {
      position: absolute;
      inset: 0;
      width: 42%;
      content: "";
      border-radius: inherit;
      background: linear-gradient(90deg, #6366f1 0%, #8b5cf6 100%);
      animation: startup-progress 1.2s ease-in-out infinite;
    }

    @keyframes startup-progress {
      0% {
        transform: translateX(-110%);
      }

      100% {
        transform: translateX(260%);
      }
    }

    @keyframes startup-hero-float {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-5px);
      }
    }

    @keyframes startup-hero-glow {
      0%,
      100% {
        opacity: 0.6;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.25);
      }
    }

    @keyframes startup-sparkle {
      0%,
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) translate(0, 0) scale(0);
      }

      50% {
        opacity: 0.9;
        transform: translate(-50%, -50%) translate(var(--sparkle-x), var(--sparkle-y)) scale(1.2);
      }
    }

    @keyframes startup-logo-draw {
      0% {
        stroke-opacity: 1;
        stroke-dashoffset: 1;
      }

      100% {
        stroke-opacity: 1;
        stroke-dashoffset: 0;
      }
    }

    @keyframes startup-logo-fill {
      to {
        fill-opacity: 1;
      }
    }

    @keyframes startup-logo-pop {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .startup-hero,
      .startup-hero::before,
      .startup-sparkle,
      .startup-progress::after,
      .startup-draw-path,
      .startup-fill-path,
      .startup-fill-pop {
        animation: none;
      }

      .startup-sparkle {
        display: none;
      }

      .startup-draw-path {
        stroke-opacity: 1;
        stroke-dashoffset: 0;
      }

      .startup-fill-path {
        fill-opacity: 1;
      }

      .startup-fill-pop {
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>

  <script>
    (function () {
      var electronWindow = window.electronWindow;
      if (!electronWindow) {
        return;
      }

      document.documentElement.classList.add("is-desktop-shell");

      function bind(id, action) {
        var element = document.getElementById(id);
        if (!element) {
          return;
        }
        element.addEventListener("click", function () {
          Promise.resolve(action()).catch(function () {});
        });
      }

      function updateHistoryButtons() {
        Promise.all([
          electronWindow.canGoBack ? electronWindow.canGoBack() : Promise.resolve(false),
          electronWindow.canGoForward ? electronWindow.canGoForward() : Promise.resolve(false),
        ]).then(function (state) {
          var back = document.getElementById("startup-back");
          var forward = document.getElementById("startup-forward");
          if (back) {
            back.disabled = !state[0];
          }
          if (forward) {
            forward.disabled = !state[1];
          }
        }).catch(function () {});
      }

      function updateMaximizeButton(isMaximized) {
        var maximize = document.getElementById("startup-maximize");
        document.documentElement.classList.toggle("is-window-maximized", Boolean(isMaximized));
        if (maximize) {
          var label = isMaximized ? "Restore" : "Maximize";
          maximize.title = label;
          maximize.setAttribute("aria-label", label);
        }
      }

      function syncMaximizedState() {
        if (!electronWindow.isMaximized) {
          return;
        }
        electronWindow.isMaximized().then(updateMaximizeButton).catch(function () {});
      }

      bind("startup-back", function () { return electronWindow.goBack && electronWindow.goBack(); });
      bind("startup-forward", function () { return electronWindow.goForward && electronWindow.goForward(); });
      bind("startup-reload", function () { return electronWindow.reload(); });
      bind("startup-minimize", function () { return electronWindow.minimize(); });
      bind("startup-maximize", function () {
        return electronWindow.toggleMaximize().then(updateMaximizeButton);
      });
      bind("startup-close", function () { return electronWindow.close(); });
      updateHistoryButtons();
      syncMaximizedState();

      if (electronWindow.onMaximizedChange) {
        electronWindow.onMaximizedChange(updateMaximizeButton);
      }

      if (electronWindow.onNavigationStateChange) {
        electronWindow.onNavigationStateChange(function (state) {
          var back = document.getElementById("startup-back");
          var forward = document.getElementById("startup-forward");
          if (back) {
            back.disabled = !state.canGoBack;
          }
          if (forward) {
            forward.disabled = !state.canGoForward;
          }
        });
      }
    })();
  </script>
