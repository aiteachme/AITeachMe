name: Publish Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
      suffix:
        description: Optional prerelease suffix
        type: choice
        required: true
        default: none
        options:
          - none
          - alpha
          - beta

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release:
    name: Prepare release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release_tag.outputs.tag }}
      version: ${{ steps.release_tag.outputs.version }}
      prerelease: ${{ steps.release_tag.outputs.prerelease }}
      commit_sha: ${{ steps.version_commit.outputs.commit_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release_tag
        run: |
          set -euo pipefail

          LATEST_TAG="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi

          VERSION="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          case "${{ inputs.bump }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
            *)
              echo "Unsupported bump type: ${{ inputs.bump }}"
              exit 1
              ;;
          esac

          SUFFIX="${{ inputs.suffix }}"
          case "$SUFFIX" in
            none)
              PRERELEASE=false
              TAG="v${MAJOR}.${MINOR}.${PATCH}"
              ;;
            alpha|beta)
              PRERELEASE=true
              TAG="v${MAJOR}.${MINOR}.${PATCH}-${SUFFIX}"
              ;;
            *)
              echo "Unsupported release suffix: $SUFFIX"
              exit 1
              ;;
          esac

          RELEASE_VERSION="${TAG#v}"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-alpha|-beta)?$ ]]; then
            echo "Tag '$TAG' does not match required format vX.X.X, vX.X.X-alpha, or vX.X.X-beta."
            exit 1
          fi

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag '$TAG' already exists."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Update project versions
        env:
          RELEASE_VERSION: ${{ steps.release_tag.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const version = process.env.RELEASE_VERSION;

          function updateJson(path, updater) {
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            updater(data);
            fs.writeFileSync(path, `${JSON.stringify(data, null, 2)}\n`);
          }

          function replaceInFile(path, replacer) {
            const before = fs.readFileSync(path, 'utf8');
            const after = replacer(before);
            fs.writeFileSync(path, after);
          }

          updateJson('frontend/package.json', (data) => {
            data.version = version;
          });

          updateJson('frontend/package-lock.json', (data) => {
            data.version = version;
            if (data.packages && data.packages['']) {
              data.packages[''].version = version;
            }
          });

          updateJson('frontend/src-tauri/tauri.conf.json', (data) => {
            data.version = version;
          });

          replaceInFile('frontend/src-tauri/Cargo.toml', (text) =>
            text.replace(/^version = "([^"]+)"/m, `version = "${version}"`)
          );

          replaceInFile('frontend/src-tauri/Cargo.lock', (text) =>
            text.replace(
              /(\[\[package\]\]\r?\nname = "aiteachme-tauri"\r?\nversion = )"([^"]+)"/,
              `$1"${version}"`
            )
          );

          replaceInFile('backend/pyproject.toml', (text) =>
            text.replace(/^version = "([^"]+)"/m, `version = "${version}"`)
          );

          replaceInFile('backend/uv.lock', (text) =>
            text.replace(
              /(\[\[package\]\]\r?\nname = "aiteachme-backend"\r?\nversion = )"([^"]+)"/,
              `$1"${version}"`
            )
          );

          replaceInFile('backend/app/shared/infra/runtime/mode.py', (text) =>
            text.replace(/^APP_VERSION = "([^"]+)"/m, `APP_VERSION = "${version}"`)
          );
          NODE

      - name: Commit version bump
        id: version_commit
        env:
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          if git diff --quiet; then
            echo "Project versions already match '$TAG'; using current commit."
          else
            git add \
              frontend/package.json \
              frontend/package-lock.json \
              frontend/src-tauri/tauri.conf.json \
              frontend/src-tauri/Cargo.toml \
              frontend/src-tauri/Cargo.lock \
              backend/pyproject.toml \
              backend/uv.lock \
              backend/app/shared/infra/runtime/mode.py

            git commit -m "chore: release $TAG"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build_default_installer:
    name: Build default Windows installer
    runs-on: windows-latest
    needs: release
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Enable long paths
        run: git config --global core.longpaths true

      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.commit_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/uv.lock

      - name: Use setup-python interpreter for packaging
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          "AITEACHME_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          python --version

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build default installer
        shell: pwsh
        run: .\packaging\release.bat

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: aiteachme-default-windows-installer
          path: packaging/release/AiTeachMe-v${{ needs.release.outputs.version }}-installer.exe
          if-no-files-found: error
          retention-days: 7

  publish_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - release
      - build_default_installer

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.commit_sha }}
          fetch-depth: 0

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: aiteachme-default-windows-installer
          path: release-assets

      - name: Create and push release tag
        env:
          TAG: ${{ needs.release.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.release.outputs.commit_sha }}
        run: |
          set -euo pipefail

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            EXISTING_COMMIT="$(git rev-list -n 1 "$TAG")"
            if [ "$EXISTING_COMMIT" != "$RELEASE_COMMIT" ]; then
              echo "Tag '$TAG' already points to '$EXISTING_COMMIT', expected '$RELEASE_COMMIT'."
              exit 1
            fi
            echo "Tag '$TAG' already exists on the release commit."
          else
            git tag "$TAG" "$RELEASE_COMMIT"
            git push origin "$TAG"
          fi

      - name: Create release with installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
          PRERELEASE: ${{ needs.release.outputs.prerelease }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release '$TAG' already exists; uploading installer asset."
            gh release upload "$TAG" release-assets/* --clobber
            exit 0
          fi

          RELEASE_ARGS=()
          if [ "$PRERELEASE" = "true" ]; then
            RELEASE_ARGS+=(--prerelease)
          fi

          gh release create "$TAG" release-assets/* \
            --title "$TAG" \
            --generate-notes \
            "${RELEASE_ARGS[@]}"
