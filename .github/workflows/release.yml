name: Publish Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
      suffix:
        description: Optional prerelease channel; alpha/beta tags are auto-numbered as alpha.1, alpha.2, ...
        type: choice
        required: true
        default: none
        options:
          - none
          - alpha
          - beta
      desktop_package_mode:
        description: 要打包并附加到 GitHub Release 的桌面端模式
        type: choice
        required: true
        default: tauri-local
        options:
          - electron-local
          - electron-remote
          - tauri-local
          - tauri-remote
          - all-local
          - all
      backend_port:
        description: local 桌面包后端端口；留空则自动分配可用端口
        type: string
        required: false
        default: ""
      api_url:
        description: remote 桌面包使用的后端 API 地址
        type: string
        required: false
        default: ""
      bundle_private_env:
        description: 是否把 Secret AITEACHME_BUNDLED_ENV_JSON 里的私有模型配置加密内置进 local 桌面包
        type: boolean
        required: true
        default: false
      bundled_env_artifact_suffix:
        description: 内置私有配置时的安装包文件名后缀
        type: string
        required: false
        default: "bundled"
      require_windows_signing:
        description: Require Windows Authenticode signing before publishing installers
        type: boolean
        required: true
        default: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release:
    name: Prepare release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release_tag.outputs.tag }}
      version: ${{ steps.release_tag.outputs.version }}
      prerelease: ${{ steps.release_tag.outputs.prerelease }}
      source_sha: ${{ steps.release_source.outputs.source_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release_tag
        run: |
          set -euo pipefail

          LATEST_TAG="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi

          VERSION="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          case "${{ inputs.bump }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
            *)
              echo "Unsupported bump type: ${{ inputs.bump }}"
              exit 1
              ;;
          esac

          TARGET_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          SUFFIX="${{ inputs.suffix }}"
          case "$SUFFIX" in
            none)
              PRERELEASE=false
              TAG="v${TARGET_VERSION}"
              ;;
            alpha|beta)
              PRERELEASE=true
              PRERELEASE_PREFIX="v${TARGET_VERSION}-${SUFFIX}"
              NEXT_PRERELEASE_NUMBER=1
              for existing_tag in $(git tag -l "${PRERELEASE_PREFIX}.*"); do
                existing_number="${existing_tag#${PRERELEASE_PREFIX}.}"
                if [[ "$existing_number" =~ ^[0-9]+$ ]] && [ "$existing_number" -ge "$NEXT_PRERELEASE_NUMBER" ]; then
                  NEXT_PRERELEASE_NUMBER=$((existing_number + 1))
                fi
              done

              TAG="${PRERELEASE_PREFIX}.${NEXT_PRERELEASE_NUMBER}"
              while git rev-parse "$TAG" >/dev/null 2>&1; do
                NEXT_PRERELEASE_NUMBER=$((NEXT_PRERELEASE_NUMBER + 1))
                TAG="${PRERELEASE_PREFIX}.${NEXT_PRERELEASE_NUMBER}"
              done
              ;;
            *)
              echo "Unsupported release suffix: $SUFFIX"
              exit 1
              ;;
          esac

          RELEASE_VERSION="${TAG#v}"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)\.[0-9]+)?$ ]]; then
            echo "Tag '$TAG' does not match required format vX.X.X or vX.X.X-alpha.N / vX.X.X-beta.N."
            exit 1
          fi

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag '$TAG' already exists."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Record release source commit
        id: release_source
        run: |
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build_desktop_installers:
    name: Build ${{ inputs.desktop_package_mode }} Windows installer
    runs-on: windows-latest
    needs: release
    env:
      PYTHONUTF8: "1"
      AITEACHME_RELEASE_TAG: ${{ needs.release.outputs.tag }}
      AITEACHME_WINDOWS_SIGNING_REQUIRED: ${{ inputs.require_windows_signing && '1' || '0' }}
      AITEACHME_WINDOWS_SIGN_COMMAND: ${{ secrets.AITEACHME_WINDOWS_SIGN_COMMAND }}
      AITEACHME_WINDOWS_PUBLISHER_NAME: ${{ vars.AITEACHME_WINDOWS_PUBLISHER_NAME || secrets.AITEACHME_WINDOWS_PUBLISHER_NAME }}
      AITEACHME_WINDOWS_TIMESTAMP_URL: ${{ vars.AITEACHME_WINDOWS_TIMESTAMP_URL }}
      AITEACHME_WINDOWS_AZURE_ENDPOINT: ${{ vars.AITEACHME_WINDOWS_AZURE_ENDPOINT || secrets.AITEACHME_WINDOWS_AZURE_ENDPOINT }}
      AITEACHME_WINDOWS_AZURE_ACCOUNT_NAME: ${{ vars.AITEACHME_WINDOWS_AZURE_ACCOUNT_NAME || secrets.AITEACHME_WINDOWS_AZURE_ACCOUNT_NAME }}
      AITEACHME_WINDOWS_AZURE_CERTIFICATE_PROFILE_NAME: ${{ vars.AITEACHME_WINDOWS_AZURE_CERTIFICATE_PROFILE_NAME || secrets.AITEACHME_WINDOWS_AZURE_CERTIFICATE_PROFILE_NAME }}
      AITEACHME_WINDOWS_CERTIFICATE_THUMBPRINT: ${{ vars.AITEACHME_WINDOWS_CERTIFICATE_THUMBPRINT || secrets.AITEACHME_WINDOWS_CERTIFICATE_THUMBPRINT }}
      AITEACHME_WINDOWS_CERTIFICATE_SHA1: ${{ vars.AITEACHME_WINDOWS_CERTIFICATE_SHA1 || secrets.AITEACHME_WINDOWS_CERTIFICATE_SHA1 }}
      AITEACHME_WINDOWS_CERTIFICATE_SUBJECT_NAME: ${{ vars.AITEACHME_WINDOWS_CERTIFICATE_SUBJECT_NAME || secrets.AITEACHME_WINDOWS_CERTIFICATE_SUBJECT_NAME }}
      AITEACHME_WINDOWS_CERTIFICATE_FILE: ${{ secrets.AITEACHME_WINDOWS_CERTIFICATE_FILE }}
      AITEACHME_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.AITEACHME_WINDOWS_CERTIFICATE_PASSWORD }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      WIN_CSC_SHA1_HASH: ${{ vars.WIN_CSC_SHA1_HASH || secrets.WIN_CSC_SHA1_HASH }}
      WIN_CSC_NAME: ${{ vars.WIN_CSC_NAME || secrets.WIN_CSC_NAME }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY || secrets.TAURI_UPDATER_PUBKEY }}
      AITEACHME_TAURI_LOCAL_UPDATER_ENDPOINT: ${{ vars.AITEACHME_TAURI_LOCAL_UPDATER_ENDPOINT }}
      AITEACHME_TAURI_LOCAL_UPDATER_ASSET_BASE_URL: ${{ vars.AITEACHME_TAURI_LOCAL_UPDATER_ASSET_BASE_URL }}

    steps:
      - name: Enable long paths
        run: git config --global core.longpaths true

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.source_sha }}

      - name: Verify Windows signing configuration
        shell: pwsh
        run: |
          . .\packaging\scripts\windows-signing-common.ps1
          $signing = Get-AITeachMeWindowsSigningState
          Assert-AITeachMeWindowsSigningReady -Signing $signing
          Write-AITeachMeWindowsSigningSummary -Signing $signing

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/uv.lock

      - name: Use setup-python interpreter for packaging
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          "AITEACHME_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          python --version

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply release version for build
        run: node packaging/scripts/apply-release-version.mjs "${{ needs.release.outputs.version }}"

      - name: Set up Rust
        if: ${{ contains(inputs.desktop_package_mode, 'tauri') || inputs.desktop_package_mode == 'all-local' || inputs.desktop_package_mode == 'all' }}
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        if: ${{ contains(inputs.desktop_package_mode, 'tauri') || inputs.desktop_package_mode == 'all-local' || inputs.desktop_package_mode == 'all' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            frontend/src-tauri/target
          key: ${{ runner.os }}-cargo-tauri-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tauri-

      - name: Install NSIS
        if: ${{ contains(inputs.desktop_package_mode, 'tauri') || inputs.desktop_package_mode == 'all-local' || inputs.desktop_package_mode == 'all' }}
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $nsisPath = Join-Path ${env:ProgramFiles(x86)} "NSIS"
          if (Test-Path $nsisPath) {
            $env:Path = "$nsisPath;$env:Path"
            $nsisPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          makensis /VERSION

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install backend dependencies
        if: ${{ contains(inputs.desktop_package_mode, 'local') || inputs.desktop_package_mode == 'all' }}
        working-directory: backend
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller

      - name: Write bundled env config
        if: ${{ inputs.bundle_private_env == true }}
        shell: pwsh
        env:
          AITEACHME_BUNDLED_ENV_JSON: ${{ secrets.AITEACHME_BUNDLED_ENV_JSON }}
        run: |
          $mode = "${{ inputs.desktop_package_mode }}"
          if ($mode -notin @("electron-local", "tauri-local", "all-local", "all")) {
            throw "Bundled env can only be used with local desktop package modes."
          }
          if ([string]::IsNullOrWhiteSpace($env:AITEACHME_BUNDLED_ENV_JSON)) {
            throw "Missing GitHub secret AITEACHME_BUNDLED_ENV_JSON."
          }
          $env:AITEACHME_BUNDLED_ENV_JSON | ConvertFrom-Json | Out-Null
          New-Item -ItemType Directory -Path packaging\private -Force | Out-Null
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) "packaging\private\bundled-env.json"),
            $env:AITEACHME_BUNDLED_ENV_JSON,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Build desktop installers
        shell: pwsh
        run: |
          $arguments = @{
            PackageMode = "${{ inputs.desktop_package_mode }}"
            ApiUrl = "${{ inputs.api_url }}"
            SkipInstall = $true
            HideElectronSuffix = $true
          }

          $backendPort = "${{ inputs.backend_port }}"
          if (-not [string]::IsNullOrWhiteSpace($backendPort)) {
            $arguments.BackendPort = $backendPort
          }

          if ("${{ inputs.bundle_private_env }}" -eq "true") {
            $arguments.ImportBundledEnv = $true
            $arguments.BundledEnvArtifactSuffix = "${{ inputs.bundled_env_artifact_suffix }}"
          }

          if ($arguments.PackageMode -in @("tauri-local", "all-local", "all")) {
            $arguments.RequireTauriUpdater = $true
            if ("${{ needs.release.outputs.prerelease }}" -eq "true" -and [string]::IsNullOrWhiteSpace($env:AITEACHME_TAURI_LOCAL_UPDATER_ENDPOINT)) {
              throw "Prerelease Tauri local builds require AITEACHME_TAURI_LOCAL_UPDATER_ENDPOINT. GitHub releases/latest is intended for the latest stable release, so configure a public alpha/beta channel manifest URL."
            }
          }

          .\packaging\scripts\build-desktop-mode.ps1 @arguments

      - name: Show release artifacts
        shell: pwsh
        run: |
          Get-ChildItem -Path packaging\release -File |
            Select-Object Name,@{Name='SizeMB';Expression={[math]::Round($_.Length / 1MB, 2)}} |
            Format-Table -AutoSize

      - name: Verify Windows installer signatures
        shell: pwsh
        run: |
          . .\packaging\scripts\windows-signing-common.ps1
          $signing = Get-AITeachMeWindowsSigningState

          $installers = @(Get-ChildItem -Path packaging\release -File -Filter "*.exe")
          if ($installers.Count -eq 0) {
            throw "No Windows installer exe was produced under packaging\release."
          }

          $failed = @()
          $unsigned = @()
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
            if ($signature.Status -ne "Valid") {
              $status = "$($installer.Name): $($signature.Status)"
              if ($signing.Enabled -or $signing.Required) {
                $failed += $status
              }
              else {
                $unsigned += $status
              }
              continue
            }
            $publisher = if ($signature.SignerCertificate) {
              $signature.SignerCertificate.Subject
            } else {
              "unknown certificate subject"
            }
            Write-Host "Signed installer: $($installer.Name) :: $publisher"
          }

          if ($failed.Count -gt 0) {
            throw "Unsigned or invalid Windows installer(s): $($failed -join '; ')"
          }

          if ($unsigned.Count -gt 0) {
            Write-Host "Windows installer(s) are unsigned because signing is not configured: $($unsigned -join '; ')" -ForegroundColor Yellow
            "Windows installer signing skipped: $($unsigned -join '; ')" >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Verify Tauri updater manifest
        if: ${{ inputs.desktop_package_mode == 'tauri-local' || inputs.desktop_package_mode == 'all-local' || inputs.desktop_package_mode == 'all' }}
        shell: pwsh
        run: |
          $manifestPath = "packaging\release\latest-tauri-local.json"
          if (-not (Test-Path $manifestPath)) {
            throw "Tauri local updater manifest was not produced: $manifestPath"
          }

          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $platform = $manifest.platforms.'windows-x86_64'
          if ($null -eq $platform) {
            throw "Tauri updater manifest is missing platforms.windows-x86_64."
          }
          if ([string]::IsNullOrWhiteSpace($platform.url)) {
            throw "Tauri updater manifest is missing the Windows package URL."
          }
          if ([string]::IsNullOrWhiteSpace($platform.signature)) {
            throw "Tauri updater manifest is missing the Windows package signature."
          }

          try {
            $packageFileName = Split-Path ([Uri]$platform.url).AbsolutePath -Leaf
          }
          catch {
            throw "Tauri updater manifest URL is not a valid absolute URL: $($platform.url)"
          }

          $packagePath = Join-Path "packaging\release" $packageFileName
          $signaturePath = "$packagePath.sig"
          if (-not (Test-Path $packagePath)) {
            throw "Tauri updater package referenced by manifest was not found: $packagePath"
          }
          if (-not (Test-Path $signaturePath)) {
            throw "Tauri updater signature file was not found: $signaturePath"
          }

          $signature = (Get-Content -LiteralPath $signaturePath -Raw).Trim()
          if ($signature -ne $platform.signature) {
            throw "Tauri updater manifest signature does not match $signaturePath."
          }

          Write-Host "Tauri updater manifest verified: $packageFileName"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aiteachme-release-windows-assets
          path: packaging/release/*
          if-no-files-found: error
          retention-days: 7

  publish_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - release
      - build_desktop_installers

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.source_sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Commit release version
        id: release_commit
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail

          node packaging/scripts/apply-release-version.mjs "$RELEASE_VERSION"

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          if git diff --quiet; then
            echo "Project versions already match '$TAG'; using current commit."
          else
            git add \
              frontend/package.json \
              frontend/package-lock.json \
              frontend/src-tauri/tauri.conf.json \
              frontend/src-tauri/Cargo.toml \
              frontend/src-tauri/Cargo.lock \
              backend/pyproject.toml \
              backend/uv.lock \
              backend/app/shared/infra/runtime/mode.py

            git commit -m "chore: release $TAG"
          fi

          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify branch still points to release source
        env:
          SOURCE_SHA: ${{ needs.release.outputs.source_sha }}
        run: |
          set -euo pipefail

          git fetch origin "${GITHUB_REF_NAME}"
          REMOTE_SHA="$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          if [ "$REMOTE_SHA" != "$SOURCE_SHA" ]; then
            echo "Branch ${GITHUB_REF_NAME} moved during release: expected $SOURCE_SHA, got $REMOTE_SHA."
            exit 1
          fi

      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          name: aiteachme-release-windows-assets
          path: release-assets

      - name: Create and push release tag
        env:
          TAG: ${{ needs.release.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.release_commit.outputs.commit_sha }}
        run: |
          set -euo pipefail

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            EXISTING_COMMIT="$(git rev-list -n 1 "$TAG")"
            if [ "$EXISTING_COMMIT" != "$RELEASE_COMMIT" ]; then
              echo "Tag '$TAG' already points to '$EXISTING_COMMIT', expected '$RELEASE_COMMIT'."
              exit 1
            fi
            echo "Tag '$TAG' already exists on the release commit."
          else
            git tag "$TAG" "$RELEASE_COMMIT"
            git push origin "$TAG"
          fi

      - name: Create release with installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
          PRERELEASE: ${{ needs.release.outputs.prerelease }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release '$TAG' already exists; uploading installer assets."
            gh release upload "$TAG" release-assets/* --clobber
            exit 0
          fi

          RELEASE_ARGS=()
          if [ "$PRERELEASE" = "true" ]; then
            RELEASE_ARGS+=(--prerelease)
          fi

          gh release create "$TAG" release-assets/* \
            --title "$TAG" \
            --generate-notes \
            "${RELEASE_ARGS[@]}"

      - name: Sync release commit to branch
        run: |
          set -euo pipefail
          git push origin "HEAD:${GITHUB_REF_NAME}"
