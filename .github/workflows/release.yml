name: Publish Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release_tag
        run: |
          set -euo pipefail

          LATEST_TAG="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi

          VERSION="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          case "${{ inputs.bump }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
            *)
              echo "Unsupported bump type: ${{ inputs.bump }}"
              exit 1
              ;;
          esac

          TAG="v${MAJOR}.${MINOR}.${PATCH}"
          RELEASE_VERSION="${TAG#v}"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$TAG' does not match required format vX.X.X."
            exit 1
          fi

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag '$TAG' already exists."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update project versions
        env:
          RELEASE_VERSION: ${{ steps.release_tag.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const version = process.env.RELEASE_VERSION;

          function updateJson(path, updater) {
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            updater(data);
            fs.writeFileSync(path, `${JSON.stringify(data, null, 2)}\n`);
          }

          function replaceInFile(path, replacer) {
            const before = fs.readFileSync(path, 'utf8');
            const after = replacer(before);
            fs.writeFileSync(path, after);
          }

          updateJson('frontend/package.json', (data) => {
            data.version = version;
          });

          updateJson('frontend/package-lock.json', (data) => {
            data.version = version;
            if (data.packages && data.packages['']) {
              data.packages[''].version = version;
            }
          });

          updateJson('frontend/src-tauri/tauri.conf.json', (data) => {
            data.version = version;
          });

          replaceInFile('frontend/src-tauri/Cargo.toml', (text) =>
            text.replace(/^version = "([^"]+)"/m, `version = "${version}"`)
          );

          replaceInFile('frontend/src-tauri/Cargo.lock', (text) =>
            text.replace(
              /(\[\[package\]\]\r?\nname = "aiteachme-tauri"\r?\nversion = )"([^"]+)"/,
              `$1"${version}"`
            )
          );

          replaceInFile('backend/pyproject.toml', (text) =>
            text.replace(/^version = "([^"]+)"/m, `version = "${version}"`)
          );

          replaceInFile('backend/uv.lock', (text) =>
            text.replace(
              /(\[\[package\]\]\r?\nname = "aiteachme-backend"\r?\nversion = )"([^"]+)"/,
              `$1"${version}"`
            )
          );

          replaceInFile('backend/app/shared/infra/runtime/mode.py', (text) =>
            text.replace(/^APP_VERSION = "([^"]+)"/m, `APP_VERSION = "${version}"`)
          );
          NODE

      - name: Commit version bump and tag
        env:
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          if git diff --quiet; then
            echo "Project versions already match '$TAG'; tagging current commit."
          else
            git add \
              frontend/package.json \
              frontend/package-lock.json \
              frontend/src-tauri/tauri.conf.json \
              frontend/src-tauri/Cargo.toml \
              frontend/src-tauri/Cargo.lock \
              backend/pyproject.toml \
              backend/uv.lock \
              backend/app/shared/infra/runtime/mode.py

            git commit -m "chore: release $TAG"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

          git tag "$TAG"
          git push origin "$TAG"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release '$TAG' already exists; nothing to create."
            exit 0
          fi

          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes
