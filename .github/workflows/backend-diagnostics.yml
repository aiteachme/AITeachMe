name: Backend diagnostics

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/backend-diagnostics.yml
      - .github/scripts/safe-startup-diagnostics.py
      - .github/scripts/safe-database-pod-diagnostics.py
  workflow_dispatch:
    inputs:
      image_revision:
        description: Full commit SHA of the failing backend image
        required: true
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.head_commit.message == 'chore: 自动运行本次临时只读部署诊断'
    name: Read scoped backend startup evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure existing cluster access
        env:
          SEALOS_KUBECONFIG_B64: ${{ secrets.SEALOS_KUBECONFIG_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SEALOS_KUBECONFIG_B64}"
          kube_dir="${RUNNER_TEMP}/backend-diagnostics"
          mkdir -p "${kube_dir}"
          chmod 700 "${kube_dir}"
          printf '%s' "${SEALOS_KUBECONFIG_B64}" | base64 -d > "${kube_dir}/config"
          chmod 600 "${kube_dir}/config"
          echo "KUBECONFIG=${kube_dir}/config" >> "$GITHUB_ENV"
      - name: Read sanitized startup evidence
        env:
          IMAGE_REVISION: ${{ inputs.image_revision || '88f8f13cc840ee8c0e375d15ce8079fc82ab65f9' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${IMAGE_REVISION}" =~ ^[0-9a-f]{40}$ ]]
          image="crpi-eit0zz7ic5vs22ow.cn-beijing.personal.cr.aliyuncs.com/aiteachme/aiteachme-backend:slim-${IMAGE_REVISION::7}"
          python .github/scripts/safe-startup-diagnostics.py \
            --namespace ns-icbq3ltw --deployment atm-d --container atm-d \
            --expected-image "${image}" --skip-dump-probe | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary cluster access
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/backend-diagnostics/config"
