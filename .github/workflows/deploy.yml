name: Trigger Deploy Webhooks

on:
  push:
    branches:
      - main  # 仅在推送或合并到 main 分支时触发

jobs:
  deploy:
    name: Trigger Cloudflare & Render Hooks
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: srv-d6ore72a214c73f6mk60

    steps:
      - name: Validate deploy secrets
        env:
          CLOUDFLARE_DEPLOY_KEY: ${{ secrets.CLOUDFLARE_DEPLOY_KEY }}
          RENDER_DEPLOY_KEY: ${{ secrets.RENDER_DEPLOY_KEY }}
        run: |
          missing=0

          if [ -z "$CLOUDFLARE_DEPLOY_KEY" ]; then
            echo "❌ 缺少 CLOUDFLARE_DEPLOY_KEY"
            missing=1
          fi

          if [ -z "$RENDER_DEPLOY_KEY" ]; then
            echo "❌ 缺少 RENDER_DEPLOY_KEY"
            missing=1
          fi

          if [ -z "$RENDER_SERVICE_ID" ]; then
            echo "❌ 缺少 RENDER_SERVICE_ID"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            echo "请在 GitHub Secrets 中配置缺失的部署参数。"
            exit 1
          fi

      - name: Trigger Cloudflare Pages (Frontend) Build
        run: |
          curl -X POST ${{ secrets.CLOUDFLARE_DEPLOY_KEY }}

      - name: Trigger Render (Backend) Build
        id: trigger_render
        run: |
          echo "🚀 触发 Render 后端部署..."
          RESPONSE=$(curl -s -X POST ${{ secrets.RENDER_DEPLOY_KEY }})
          echo "Response: $RESPONSE"
          echo "✅ 部署已触发，开始监测状态..."

      - name: Wait for Render Deployment
        run: |
          echo "⏳ 等待 Render 部署完成..."

          # 检查 API Key 是否配置
          if [ -z "$RENDER_API_KEY" ]; then
            echo "⚠️ RENDER_API_KEY 未配置，跳过状态监测"
            echo "💡 请在 GitHub Settings → Secrets 中添加 RENDER_API_KEY"
            exit 0
          fi

          MAX_WAIT=900
          INTERVAL=30
          ELAPSED=0

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            DEPLOY_INFO=$(curl -s "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys?limit=1" \
              -H "Accept: application/json" \
              -H "Authorization: Bearer ${RENDER_API_KEY}")

            if echo "$DEPLOY_INFO" | grep -q "Unauthorized"; then
              echo "❌ API Key 无效或已过期"
              exit 1
            fi

            STATUS=$(echo "$DEPLOY_INFO" | jq -r '.[0].deploy.status // "unknown"' 2>/dev/null || echo "error")
            DEPLOY_ID=$(echo "$DEPLOY_INFO" | jq -r '.[0].deploy.id // "unknown"' 2>/dev/null || echo "error")

            if [ "$STATUS" = "error" ]; then
              echo "⚠️ 无法解析部署状态，等待下次检查..."
              sleep $INTERVAL
              ELAPSED=$((ELAPSED + INTERVAL))
              continue
            fi

            echo "📊 部署状态: $STATUS (ID: $DEPLOY_ID)"

            if [ "$STATUS" = "live" ]; then
              echo "✅ 后端部署成功！"
              echo "🔗 服务地址: https://aiteachme.onrender.com"
              exit 0
            elif [ "$STATUS" = "build_failed" ] || [ "$STATUS" = "update_failed" ]; then
              echo "❌ 后端部署失败！状态: $STATUS"
              exit 1
            elif [ "$STATUS" = "canceled" ]; then
              echo "⚠️ 部署已取消"
              exit 1
            fi

            if [ "$STATUS" = "building" ]; then
              echo "🔨 正在构建..."
            elif [ "$STATUS" = "deploying" ]; then
              echo "📦 正在部署..."
            fi

            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "⏰ 部署超时（超过 ${MAX_WAIT} 秒）"
          exit 1

      - name: Deployment Summary
        if: always()
        run: |
          echo "================================"
          echo "📋 部署摘要"
          echo "================================"
          echo "前端: Cloudflare Pages"
          echo "后端: Render (https://aiteachme.onrender.com)"
          echo "================================"
