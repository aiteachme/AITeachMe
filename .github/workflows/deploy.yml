name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

env:
  # Non-secret deployment constants are intentionally kept here for maintainer
  # convenience. Do not put deploy hooks, kubeconfig, registry passwords, or
  # other credentials here; those must stay in GitHub Secrets.
  # Nginx resolves runtime proxy_pass variables by itself, so use the full
  # Kubernetes service FQDN instead of the Sealos UI short service.namespace form.
  AITEACHME_API_UPSTREAM: http://atm-d-tgkmhxmhacer.ns-icbq3ltw.svc.cluster.local:9020
  BACKEND_ACR_NAMESPACE: aiteachme
  BACKEND_ACR_REGISTRY: crpi-eit0zz7ic5vs22ow.cn-beijing.personal.cr.aliyuncs.com
  BACKEND_IMAGE_NAME: aiteachme-backend
  BACKEND_ROLLOUT_TIMEOUT_SECONDS: "3600"
  FRONTEND_ACR_NAMESPACE: aiteachme
  FRONTEND_ACR_REGISTRY: crpi-eit0zz7ic5vs22ow.cn-beijing.personal.cr.aliyuncs.com
  FRONTEND_IMAGE_NAME: aiteachme-frontend
  FRONTEND_PUBLIC_URL: https://aiteachme.cn
  FRONTEND_ROLLOUT_TIMEOUT_SECONDS: "600"
  SEALOS_BACKEND_DEPLOYMENT: atm-d
  SEALOS_FRONTEND_DEPLOYMENT: atm-frontend
  SEALOS_IMAGE_PULL_SECRET: aliyun-acr-regcred
  SEALOS_NAMESPACE: ns-icbq3ltw

concurrency:
  group: deploy-main
  # Keep only the newest main deployment; older in-progress runs may appear as canceled.
  cancel-in-progress: true

jobs:
  verify-latest:
    name: Verify deploy target
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.guard.outputs.should_deploy }}
      source_sha: ${{ steps.guard.outputs.source_sha }}

    steps:
      - name: Skip stale CI runs
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail

          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

          if [ "${EVENT_NAME}" = "workflow_run" ] && [ "${WORKFLOW_RUN_CONCLUSION}" != "success" ]; then
            echo "Skipping deploy because CI conclusion is ${WORKFLOW_RUN_CONCLUSION}."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_sha="$(
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
              | jq -r '.object.sha'
          )"
          if [ -z "${latest_sha}" ] || [ "${latest_sha}" = "null" ]; then
            echo "Could not resolve latest main SHA." >&2
            exit 1
          fi

          if [ "${SOURCE_SHA}" = "${latest_sha}" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping stale deploy: source SHA ${SOURCE_SHA} is not current main ${latest_sha}."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-frontend:
    name: Deploy frontend to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: verify-latest
    if: needs.verify-latest.outputs.should_deploy == 'true'

    steps:
      - name: Check Cloudflare deploy hook opt-in
        id: optin
        env:
          CLOUDFLARE_DEPLOY_KEY: ${{ secrets.CLOUDFLARE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_DEPLOY_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "Cloudflare Pages deploy skipped."
              echo
              echo "Set GitHub secret CLOUDFLARE_DEPLOY_KEY to enable it."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Cloudflare Pages build
        if: steps.optin.outputs.enabled == 'true'
        env:
          CLOUDFLARE_DEPLOY_KEY: ${{ secrets.CLOUDFLARE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          curl -fsS -X POST "$CLOUDFLARE_DEPLOY_KEY"

      - name: Frontend summary
        if: steps.optin.outputs.enabled == 'true'
        run: |
          echo "Frontend: Cloudflare Pages deploy hook triggered." >> "$GITHUB_STEP_SUMMARY"

  deploy-frontend-sealos:
    name: Deploy frontend to Sealos
    runs-on: ubuntu-latest
    needs:
      - verify-latest
      - deploy-backend
    # The frontend Sealos smoke test exercises proxied /api upload traffic, so
    # wait until the backend rollout has finished instead of racing it.
    if: always() && needs.verify-latest.outputs.should_deploy == 'true' && needs.deploy-backend.result == 'success'
    permissions:
      contents: read
      packages: write
    env:
      SEALOS_KUBECONFIG_B64: ${{ secrets.SEALOS_KUBECONFIG_B64 }}
      SOURCE_SHA: ${{ needs.verify-latest.outputs.source_sha }}
      ALIYUN_ACR_USERNAME: ${{ secrets.ALIYUN_ACR_USERNAME }}
      ALIYUN_ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}

    steps:
      - name: Check Sealos frontend deployment opt-in
        id: optin
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${SEALOS_FRONTEND_DEPLOYMENT}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "Sealos frontend deploy skipped."
              echo
              echo "Set workflow env SEALOS_FRONTEND_DEPLOYMENT after creating the Sealos frontend app."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -z "${ALIYUN_ACR_USERNAME}" ] || [ -z "${ALIYUN_ACR_PASSWORD}" ] || [ -z "${SEALOS_KUBECONFIG_B64}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "Sealos frontend deploy skipped."
              echo
              echo "Set GitHub secrets ALIYUN_ACR_USERNAME, ALIYUN_ACR_PASSWORD, and SEALOS_KUBECONFIG_B64 to enable it."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.optin.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Validate Sealos frontend deploy configuration
        if: steps.optin.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          [ -n "${ALIYUN_ACR_USERNAME}" ] || missing+=("secret:ALIYUN_ACR_USERNAME")
          [ -n "${ALIYUN_ACR_PASSWORD}" ] || missing+=("secret:ALIYUN_ACR_PASSWORD")
          [ -n "${SEALOS_KUBECONFIG_B64}" ] || missing+=("secret:SEALOS_KUBECONFIG_B64")
          [ -n "${SEALOS_NAMESPACE}" ] || missing+=("env:SEALOS_NAMESPACE")
          [ -n "${SEALOS_FRONTEND_DEPLOYMENT}" ] || missing+=("env:SEALOS_FRONTEND_DEPLOYMENT")
          [ -n "${FRONTEND_ACR_REGISTRY}" ] || missing+=("env:FRONTEND_ACR_REGISTRY")
          [ -n "${FRONTEND_ACR_NAMESPACE}" ] || missing+=("env:FRONTEND_ACR_NAMESPACE")
          [ -n "${FRONTEND_IMAGE_NAME}" ] || missing+=("env:FRONTEND_IMAGE_NAME")
          [ -n "${SEALOS_IMAGE_PULL_SECRET}" ] || missing+=("env:SEALOS_IMAGE_PULL_SECRET")
          [ -n "${AITEACHME_API_UPSTREAM}" ] || missing+=("env:AITEACHME_API_UPSTREAM")

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required Sealos frontend deploy configuration:\n' >&2
            printf ' - %s\n' "${missing[@]}" >&2
            exit 1
          fi

          if ! [[ "${FRONTEND_ROLLOUT_TIMEOUT_SECONDS}" =~ ^[0-9]+$ ]]; then
            echo "FRONTEND_ROLLOUT_TIMEOUT_SECONDS must be an integer number of seconds." >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        if: steps.optin.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.optin.outputs.enabled == 'true'
        shell: bash
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          for attempt in {1..4}; do
            if printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${GHCR_USERNAME}" --password-stdin; then
              exit 0
            fi
            echo "GHCR login failed; retrying (${attempt}/4)..." >&2
            sleep $((attempt * 10))
          done

          echo "GHCR login failed after retries." >&2
          exit 1

      - name: Log in to Aliyun ACR
        if: steps.optin.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..4}; do
            if printf '%s' "${ALIYUN_ACR_PASSWORD}" | docker login "${FRONTEND_ACR_REGISTRY}" --username "${ALIYUN_ACR_USERNAME}" --password-stdin; then
              exit 0
            fi
            echo "Aliyun ACR login failed; retrying (${attempt}/4)..." >&2
            sleep $((attempt * 10))
          done

          echo "Aliyun ACR login failed after retries." >&2
          exit 1

      - name: Resolve frontend image tags
        if: steps.optin.outputs.enabled == 'true'
        id: image
        shell: bash
        run: |
          set -euo pipefail

          owner="${GITHUB_REPOSITORY_OWNER,,}"
          ghcr_image="ghcr.io/${owner}/${FRONTEND_IMAGE_NAME}"
          acr_image="${FRONTEND_ACR_REGISTRY}/${FRONTEND_ACR_NAMESPACE}/${FRONTEND_IMAGE_NAME}"
          short_sha="${SOURCE_SHA::7}"
          version_tag="nginx-${short_sha}"

          echo "image=${acr_image}:${version_tag}" >> "$GITHUB_OUTPUT"
          echo "ghcr_image=${ghcr_image}:${version_tag}" >> "$GITHUB_OUTPUT"
          echo "tags=${ghcr_image}:${version_tag},${ghcr_image}:nginx-latest,${acr_image}:${version_tag},${acr_image}:nginx-latest" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend image
        if: steps.optin.outputs.enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/deployment/docker/frontend.Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            VITE_API_URL=
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.title=AITeachMe frontend nginx
          cache-from: type=gha,scope=frontend-nginx
          cache-to: type=gha,mode=max,scope=frontend-nginx

      - name: Set up kubectl
        if: steps.optin.outputs.enabled == 'true'
        uses: azure/setup-kubectl@v4

      - name: Configure Sealos kubeconfig
        if: steps.optin.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          kube_dir="${RUNNER_TEMP}/kube"
          mkdir -p "${kube_dir}"
          printf '%s' "${SEALOS_KUBECONFIG_B64}" | base64 -d > "${kube_dir}/config"
          chmod 600 "${kube_dir}/config"
          echo "KUBECONFIG=${kube_dir}/config" >> "$GITHUB_ENV"

      - name: Update Sealos frontend deployment
        if: steps.optin.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "Deploying frontend image: ${{ steps.image.outputs.image }}"
          echo "API upstream: ${AITEACHME_API_UPSTREAM}"
          echo "Rollout timeout: ${FRONTEND_ROLLOUT_TIMEOUT_SECONDS}s"

          kubectl -n "${SEALOS_NAMESPACE}" patch \
            "deployment/${SEALOS_FRONTEND_DEPLOYMENT}" \
            --type=merge \
            -p "{\"spec\":{\"progressDeadlineSeconds\":${FRONTEND_ROLLOUT_TIMEOUT_SECONDS}}}"

          kubectl -n "${SEALOS_NAMESPACE}" get \
            "secret/${SEALOS_IMAGE_PULL_SECRET}" \
            >/dev/null

          kubectl -n "${SEALOS_NAMESPACE}" patch \
            "deployment/${SEALOS_FRONTEND_DEPLOYMENT}" \
            -p "{\"spec\":{\"template\":{\"spec\":{\"imagePullSecrets\":[{\"name\":\"${SEALOS_IMAGE_PULL_SECRET}\"}]}}}}"

          kubectl -n "${SEALOS_NAMESPACE}" set env \
            "deployment/${SEALOS_FRONTEND_DEPLOYMENT}" \
            "AITEACHME_API_UPSTREAM=${AITEACHME_API_UPSTREAM}"

          kubectl -n "${SEALOS_NAMESPACE}" set image \
            "deployment/${SEALOS_FRONTEND_DEPLOYMENT}" \
            "*=${{ steps.image.outputs.image }}"

          kubectl -n "${SEALOS_NAMESPACE}" rollout status \
            "deployment/${SEALOS_FRONTEND_DEPLOYMENT}" \
            --timeout="${FRONTEND_ROLLOUT_TIMEOUT_SECONDS}s"

      - name: Show Sealos frontend rollout diagnostics
        if: always() && steps.optin.outputs.enabled == 'true'
        shell: bash
        run: |
          set +e

          echo "## Deployment"
          kubectl -n "${SEALOS_NAMESPACE}" get \
            "deployment/${SEALOS_FRONTEND_DEPLOYMENT}" \
            -o wide

          echo
          echo "## ReplicaSets"
          kubectl -n "${SEALOS_NAMESPACE}" get rs -o wide \
            | grep -E "^${SEALOS_FRONTEND_DEPLOYMENT}-|^NAME" || true

          echo
          echo "## Pods"
          kubectl -n "${SEALOS_NAMESPACE}" get pods -o wide \
            | grep -E "^${SEALOS_FRONTEND_DEPLOYMENT}-|^NAME" || true

          echo
          echo "## Recent events"
          kubectl -n "${SEALOS_NAMESPACE}" get events --sort-by=.lastTimestamp \
            | grep -E "^LAST SEEN|${SEALOS_FRONTEND_DEPLOYMENT}" \
            | tail -n 80 || true

          echo
          echo "## Services"
          kubectl -n "${SEALOS_NAMESPACE}" get svc,endpoints -o wide \
            | grep -E "^${SEALOS_FRONTEND_DEPLOYMENT}\\b|^${SEALOS_BACKEND_DEPLOYMENT}\\b|^NAME" || true

          echo
          echo "## Frontend pod logs"
          for pod in $(kubectl -n "${SEALOS_NAMESPACE}" get pods -o name | grep -E "pod/${SEALOS_FRONTEND_DEPLOYMENT}-" || true); do
            echo
            echo "### ${pod} current logs"
            kubectl -n "${SEALOS_NAMESPACE}" logs "${pod}" --all-containers --tail=160 || true
            echo
            echo "### ${pod} previous logs"
            kubectl -n "${SEALOS_NAMESPACE}" logs "${pod}" --all-containers --previous --tail=160 || true
            echo
            echo "### ${pod} nginx runtime probe"
            kubectl -n "${SEALOS_NAMESPACE}" exec "${pod}" -- sh -lc '
              echo "AITEACHME_API_UPSTREAM=${AITEACHME_API_UPSTREAM:-}";
              echo "--- /etc/nginx/conf.d/default.conf";
              sed -n "1,140p" /etc/nginx/conf.d/default.conf;
              echo "--- local static probe";
              wget -S -O /dev/null -T 5 http://127.0.0.1/ 2>&1 || true;
              echo "--- local api probe";
              wget -S -O - -T 5 http://127.0.0.1/api/health 2>&1 || true;
            ' || true
          done

      - name: Smoke test Sealos frontend
        id: smoke_frontend
        if: steps.optin.outputs.enabled == 'true' && env.FRONTEND_PUBLIC_URL != ''
        shell: bash
        run: |
          set -euo pipefail

          base_url="${FRONTEND_PUBLIC_URL%/}"
          root_url="${base_url}/"
          health_url="${base_url}/api/health"
          upload_url="${base_url}/api/v1/files/upload"
          # Keep this above common 1 MiB ingress defaults, but below the real 10 MB app limit.
          upload_probe_bytes=$((1280 * 1024))
          upload_probe_label="1.25MiB"

          readiness_ok=false
          for attempt in {1..12}; do
            root_status="$(curl -sS -o /tmp/frontend-root.out -w "%{http_code}" "${root_url}" || true)"
            health_status="$(curl -sS -o /tmp/frontend-health.out -w "%{http_code}" "${health_url}" || true)"

            echo "Frontend readiness smoke attempt ${attempt}/12: / -> ${root_status}, /api/health -> ${health_status}"

            if [ "${root_status}" = "200" ] && [ "${health_status}" = "200" ]; then
              readiness_ok=true
              break
            fi
            sleep 10
          done

          if [ "${readiness_ok}" != "true" ]; then
            echo "Sealos frontend readiness smoke check did not pass: ${base_url}" >&2
            echo "Last frontend root response:" >&2
            tail -c 1000 /tmp/frontend-root.out >&2 || true
            echo "" >&2
            echo "Last frontend health response:" >&2
            tail -c 1000 /tmp/frontend-health.out >&2 || true
            echo "" >&2
            exit 1
          fi

          python3 backend/scripts/smoke_upload_body.py \
            --url "${upload_url}" \
            --expected-status 422 \
            --bytes "${upload_probe_bytes}" \
            --label "${upload_probe_label}" \
            --attempts 4 \
            --timeout 120 \
            --sleep 15

      - name: Show Sealos frontend logs after failed smoke
        if: always() && steps.smoke_frontend.outcome == 'failure' && steps.optin.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          selector="app=${SEALOS_FRONTEND_DEPLOYMENT}"
          pods="$(kubectl -n "${SEALOS_NAMESPACE}" get pods -l "${selector}" -o name 2>/dev/null || true)"
          if [ -z "${pods}" ]; then
            pods="$(
              kubectl -n "${SEALOS_NAMESPACE}" get pods --no-headers 2>/dev/null \
                | awk -v prefix="${SEALOS_FRONTEND_DEPLOYMENT}-" '$1 ~ "^" prefix { print "pod/" $1 }' \
                || true
            )"
          fi

          if [ -z "${pods}" ]; then
            echo "No frontend pods found for diagnostics."
            exit 0
          fi

          for pod in ${pods}; do
            echo "### ${pod} logs after failed smoke"
            kubectl -n "${SEALOS_NAMESPACE}" logs "${pod}" --all-containers --tail=240 || true
          done

      - name: Sealos frontend summary
        if: steps.optin.outputs.enabled == 'true'
        shell: bash
        run: |
          {
            echo "Frontend image: ${{ steps.image.outputs.image }}"
            echo "Sealos namespace: ${SEALOS_NAMESPACE}"
            echo "Sealos deployment: ${SEALOS_FRONTEND_DEPLOYMENT}"
            echo "API upstream: ${AITEACHME_API_UPSTREAM}"
            if [ -n "${FRONTEND_PUBLIC_URL}" ]; then
              echo "Public URL: ${FRONTEND_PUBLIC_URL}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-backend:
    name: Deploy backend to Sealos
    runs-on: ubuntu-latest
    needs: verify-latest
    if: needs.verify-latest.outputs.should_deploy == 'true'
    permissions:
      contents: read
      packages: write
    env:
      SEALOS_KUBECONFIG_B64: ${{ secrets.SEALOS_KUBECONFIG_B64 }}
      SOURCE_SHA: ${{ needs.verify-latest.outputs.source_sha }}
      ALIYUN_ACR_USERNAME: ${{ secrets.ALIYUN_ACR_USERNAME }}
      ALIYUN_ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}

    steps:
      - name: Check Sealos backend deployment opt-in
        id: optin
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${SEALOS_BACKEND_DEPLOYMENT}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "Sealos backend deploy skipped."
              echo
              echo "Set workflow env SEALOS_BACKEND_DEPLOYMENT after creating the Sealos backend app."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -z "${ALIYUN_ACR_USERNAME}" ] || [ -z "${ALIYUN_ACR_PASSWORD}" ] || [ -z "${SEALOS_KUBECONFIG_B64}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "Sealos backend deploy skipped."
              echo
              echo "Set GitHub secrets ALIYUN_ACR_USERNAME, ALIYUN_ACR_PASSWORD, and SEALOS_KUBECONFIG_B64 to enable it."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.optin.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Validate Sealos deploy configuration
        if: steps.optin.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          [ -n "${ALIYUN_ACR_USERNAME}" ] || missing+=("secret:ALIYUN_ACR_USERNAME")
          [ -n "${ALIYUN_ACR_PASSWORD}" ] || missing+=("secret:ALIYUN_ACR_PASSWORD")
          [ -n "${SEALOS_KUBECONFIG_B64}" ] || missing+=("secret:SEALOS_KUBECONFIG_B64")
          [ -n "${SEALOS_NAMESPACE}" ] || missing+=("env:SEALOS_NAMESPACE")
          [ -n "${SEALOS_BACKEND_DEPLOYMENT}" ] || missing+=("env:SEALOS_BACKEND_DEPLOYMENT")
          [ -n "${BACKEND_ACR_REGISTRY}" ] || missing+=("env:BACKEND_ACR_REGISTRY")
          [ -n "${BACKEND_ACR_NAMESPACE}" ] || missing+=("env:BACKEND_ACR_NAMESPACE")
          [ -n "${BACKEND_IMAGE_NAME}" ] || missing+=("env:BACKEND_IMAGE_NAME")
          [ -n "${SEALOS_IMAGE_PULL_SECRET}" ] || missing+=("env:SEALOS_IMAGE_PULL_SECRET")

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required deploy configuration:\n' >&2
            printf ' - %s\n' "${missing[@]}" >&2
            exit 1
          fi

          if ! [[ "${BACKEND_ROLLOUT_TIMEOUT_SECONDS}" =~ ^[0-9]+$ ]]; then
            echo "BACKEND_ROLLOUT_TIMEOUT_SECONDS must be an integer number of seconds." >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        if: steps.optin.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.optin.outputs.enabled == 'true'
        shell: bash
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          for attempt in {1..4}; do
            if printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${GHCR_USERNAME}" --password-stdin; then
              exit 0
            fi
            echo "GHCR login failed; retrying (${attempt}/4)..." >&2
            sleep $((attempt * 10))
          done

          echo "GHCR login failed after retries." >&2
          exit 1

      - name: Log in to Aliyun ACR
        if: steps.optin.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..4}; do
            if printf '%s' "${ALIYUN_ACR_PASSWORD}" | docker login "${BACKEND_ACR_REGISTRY}" --username "${ALIYUN_ACR_USERNAME}" --password-stdin; then
              exit 0
            fi
            echo "Aliyun ACR login failed; retrying (${attempt}/4)..." >&2
            sleep $((attempt * 10))
          done

          echo "Aliyun ACR login failed after retries." >&2
          exit 1

      - name: Resolve backend image tags
        if: steps.optin.outputs.enabled == 'true'
        id: image
        shell: bash
        run: |
          set -euo pipefail

          owner="${GITHUB_REPOSITORY_OWNER,,}"
          ghcr_image="ghcr.io/${owner}/${BACKEND_IMAGE_NAME}"
          acr_image="${BACKEND_ACR_REGISTRY}/${BACKEND_ACR_NAMESPACE}/${BACKEND_IMAGE_NAME}"
          short_sha="${SOURCE_SHA::7}"
          version_tag="slim-${short_sha}"

          echo "image=${acr_image}:${version_tag}" >> "$GITHUB_OUTPUT"
          echo "ghcr_image=${ghcr_image}:${version_tag}" >> "$GITHUB_OUTPUT"
          echo "tags=${ghcr_image}:${version_tag},${ghcr_image}:slim-latest,${acr_image}:${version_tag},${acr_image}:slim-latest" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        if: steps.optin.outputs.enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/deployment/docker/backend.Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.title=AITeachMe backend slim
          cache-from: type=gha,scope=backend-slim
          cache-to: type=gha,mode=max,scope=backend-slim

      - name: Set up kubectl
        if: steps.optin.outputs.enabled == 'true'
        uses: azure/setup-kubectl@v4

      - name: Configure Sealos kubeconfig
        if: steps.optin.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          kube_dir="${RUNNER_TEMP}/kube"
          mkdir -p "${kube_dir}"
          printf '%s' "${SEALOS_KUBECONFIG_B64}" | base64 -d > "${kube_dir}/config"
          chmod 600 "${kube_dir}/config"
          echo "KUBECONFIG=${kube_dir}/config" >> "$GITHUB_ENV"

      - name: Update Sealos deployment image
        if: steps.optin.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "Deploying backend image: ${{ steps.image.outputs.image }}"
          echo "Rollout timeout: ${BACKEND_ROLLOUT_TIMEOUT_SECONDS}s"

          kubectl -n "${SEALOS_NAMESPACE}" patch \
            "deployment/${SEALOS_BACKEND_DEPLOYMENT}" \
            --type=merge \
            -p "{\"spec\":{\"progressDeadlineSeconds\":${BACKEND_ROLLOUT_TIMEOUT_SECONDS}}}"

          kubectl -n "${SEALOS_NAMESPACE}" get \
            "secret/${SEALOS_IMAGE_PULL_SECRET}" \
            >/dev/null

          kubectl -n "${SEALOS_NAMESPACE}" patch \
            "deployment/${SEALOS_BACKEND_DEPLOYMENT}" \
            -p "{\"spec\":{\"template\":{\"spec\":{\"imagePullSecrets\":[{\"name\":\"${SEALOS_IMAGE_PULL_SECRET}\"}]}}}}"

          backend_container_name="$(
            kubectl -n "${SEALOS_NAMESPACE}" get \
              "deployment/${SEALOS_BACKEND_DEPLOYMENT}" \
              -o jsonpath='{.spec.template.spec.containers[0].name}'
          )"
          if [ -z "${backend_container_name}" ]; then
            echo "Could not resolve backend container name from deployment/${SEALOS_BACKEND_DEPLOYMENT}." >&2
            exit 1
          fi

          security_patch="$(
            cat <<JSON
          {
            "spec": {
              "template": {
                "spec": {
                  "securityContext": {
                    "runAsNonRoot": true,
                    "runAsUser": 10001,
                    "runAsGroup": 10001,
                    "fsGroup": 10001,
                    "seccompProfile": {
                      "type": "RuntimeDefault"
                    }
                  },
                  "containers": [
                    {
                      "name": "${backend_container_name}",
                      "securityContext": {
                        "allowPrivilegeEscalation": false,
                        "capabilities": {
                          "drop": ["ALL"]
                        }
                      }
                    }
                  ]
                }
              }
            }
          }
          JSON
          )"
          kubectl -n "${SEALOS_NAMESPACE}" patch \
            "deployment/${SEALOS_BACKEND_DEPLOYMENT}" \
            --type=strategic \
            -p "${security_patch}"

          kubectl -n "${SEALOS_NAMESPACE}" set image \
            "deployment/${SEALOS_BACKEND_DEPLOYMENT}" \
            "*=${{ steps.image.outputs.image }}"

          kubectl -n "${SEALOS_NAMESPACE}" rollout status \
            "deployment/${SEALOS_BACKEND_DEPLOYMENT}" \
            --timeout="${BACKEND_ROLLOUT_TIMEOUT_SECONDS}s"

      - name: Show Sealos rollout diagnostics
        if: always() && steps.optin.outputs.enabled == 'true'
        shell: bash
        run: |
          set +e

          echo "## Deployment"
          kubectl -n "${SEALOS_NAMESPACE}" get \
            "deployment/${SEALOS_BACKEND_DEPLOYMENT}" \
            -o wide

          echo
          echo "## ReplicaSets"
          kubectl -n "${SEALOS_NAMESPACE}" get rs -o wide \
            | grep -E "^${SEALOS_BACKEND_DEPLOYMENT}-|^NAME" || true

          echo
          echo "## Pods"
          kubectl -n "${SEALOS_NAMESPACE}" get pods -o wide \
            | grep -E "^${SEALOS_BACKEND_DEPLOYMENT}-|^NAME" || true

          echo
          echo "## Deployment describe"
          kubectl -n "${SEALOS_NAMESPACE}" describe \
            "deployment/${SEALOS_BACKEND_DEPLOYMENT}" || true

          echo
          echo "## Pod describe"
          for pod in $(kubectl -n "${SEALOS_NAMESPACE}" get pods --no-headers 2>/dev/null \
            | awk -v prefix="${SEALOS_BACKEND_DEPLOYMENT}-" '$1 ~ "^" prefix { print $1 }'); do
            echo
            echo "### ${pod}"
            kubectl -n "${SEALOS_NAMESPACE}" describe pod "${pod}" || true
          done

          echo
          echo "## Pod logs"
          for pod in $(kubectl -n "${SEALOS_NAMESPACE}" get pods --no-headers 2>/dev/null \
            | awk -v prefix="${SEALOS_BACKEND_DEPLOYMENT}-" '$1 ~ "^" prefix { print $1 }'); do
            echo
            echo "### ${pod}"
            kubectl -n "${SEALOS_NAMESPACE}" logs "${pod}" --all-containers --tail=200 || true
            echo
            echo "### ${pod} previous"
            kubectl -n "${SEALOS_NAMESPACE}" logs "${pod}" --all-containers --previous --tail=200 || true
          done

          echo
          echo "## Recent events"
          kubectl -n "${SEALOS_NAMESPACE}" get events --sort-by=.lastTimestamp \
            | grep -E "^LAST SEEN|${SEALOS_BACKEND_DEPLOYMENT}" \
            | tail -n 80 || true

      - name: Smoke test backend in cluster
        if: steps.optin.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          health_probe='import os, urllib.request; port = os.environ.get("PORT") or "9020"; url = "http://127.0.0.1:%s/api/health" % port; print(urllib.request.urlopen(url, timeout=5).read().decode("utf-8"))'

          for attempt in {1..12}; do
            pod="$(
              kubectl -n "${SEALOS_NAMESPACE}" get pods --no-headers 2>/dev/null \
                | awk -v prefix="${SEALOS_BACKEND_DEPLOYMENT}-" '$1 ~ "^" prefix && $3 == "Running" { print $1; exit }'
            )"

            if [ -n "${pod}" ] \
              && kubectl -n "${SEALOS_NAMESPACE}" exec "${pod}" -- python -c "${health_probe}" \
              && kubectl -n "${SEALOS_NAMESPACE}" exec "${pod}" -- sh -c \
                'python scripts/smoke_upload_body.py --url "http://127.0.0.1:${PORT:-9020}/api/v1/files/upload" --expected-status 422 --bytes 1310720 --label 1.25MiB --attempts 1 --timeout 60 --sleep 0'; then
              exit 0
            fi

            echo "Backend in-cluster health/upload check failed; retrying (${attempt}/12)..."
            sleep 10
          done

          echo "Backend in-cluster health/upload check did not pass." >&2
          exit 1

      - name: Backend summary
        if: steps.optin.outputs.enabled == 'true'
        shell: bash
        run: |
          {
            echo "Backend image: ${{ steps.image.outputs.image }}"
            echo "Sealos namespace: ${SEALOS_NAMESPACE}"
            echo "Sealos deployment: ${SEALOS_BACKEND_DEPLOYMENT}"
            echo "Health check: in-cluster pod localhost /api/health"
            echo "Upload check: in-cluster 1.25MiB multipart /api/v1/files/upload -> 422"
          } >> "$GITHUB_STEP_SUMMARY"
