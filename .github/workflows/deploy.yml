name: Trigger Frontend Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-frontend:
    name: Trigger Cloudflare Pages
    runs-on: ubuntu-latest

    steps:
      - name: Validate deploy secret
        env:
          CLOUDFLARE_DEPLOY_KEY: ${{ secrets.CLOUDFLARE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_DEPLOY_KEY" ]; then
            echo "Missing CLOUDFLARE_DEPLOY_KEY."
            echo "Configure it in GitHub Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Trigger Cloudflare Pages build
        env:
          CLOUDFLARE_DEPLOY_KEY: ${{ secrets.CLOUDFLARE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          curl -fsS -X POST "$CLOUDFLARE_DEPLOY_KEY"

      - name: Deployment summary
        run: |
          echo "Frontend: Cloudflare Pages" >> "$GITHUB_STEP_SUMMARY"
          echo "Backend: Sealos backend image is built by the Build Backend Images workflow." >> "$GITHUB_STEP_SUMMARY"
