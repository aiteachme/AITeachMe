name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Compile backend
        run: uv run python -m compileall app scripts

      - name: Run tests
        run: uv run python -m pytest

      - name: Validate migrations
        run: uv run python scripts/check_migration_sql.py

      - name: Check OpenAPI sync
        run: uv run python scripts/check_openapi_sync.py

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend security tests
        run: npm run test:security

      - name: Run library Markdown tests
        run: npm run test:library-markdown

      - name: Run SSE parser tests
        run: npm run test:sse

      - name: Run question marking tests
        run: npm run test:question-marking

      - name: Run question bank filter tests
        run: npm run test:question-bank-filters

      - name: Run question template detail tests
        run: npm run test:question-template-detail

      - name: Run exam submission flow tests
        run: npm run test:exam-submission-flow

      - name: Run exam paper export tests
        run: npm run test:exam-paper-export

      - name: Run study guide stream tests
        run: npm run test:study-guide-stream

      - name: Run mastery drill progress tests
        run: npm run test:mastery-drill-progress

      - name: Run training config tests
        run: npm run test:training-config

      - name: Build
        run: npm run build

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
