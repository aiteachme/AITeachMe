name: Build Backend Images

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Backend image variant to build
        type: choice
        required: true
        default: office
        options:
          - office
          - slim
          - both
      tag:
        description: Optional tag suffix, for example 20260429-rc1. Defaults to YYYYMMDD-shortsha.
        type: string
        required: false
        default: ""
      push_latest:
        description: Also push <variant>-latest tags
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: build-backend-images-${{ github.ref }}-${{ inputs.variant }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.variant }} backend image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.variant == 'both' && '["office","slim"]' || format('["{0}"]', inputs.variant)) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: image
        shell: bash
        run: |
          set -euo pipefail

          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/aiteachme-backend"
          raw_tag="${{ inputs.tag }}"
          if [ -z "${raw_tag// }" ]; then
            raw_tag="$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          fi
          if [[ ! "$raw_tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,100}$ ]]; then
            echo "Tag suffix must start with a letter, number, or underscore, and may only contain letters, numbers, dots, underscores, and dashes: $raw_tag" >&2
            exit 1
          fi

          tags="${image}:${{ matrix.variant }}-${raw_tag}"
          if [ "${{ inputs.push_latest }}" = "true" ]; then
            tags="${tags},${image}:${{ matrix.variant }}-latest"
          fi

          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "Resolved tags: ${tags}"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.variant == 'office' && 'infra/deployment/docker/backend-office.Dockerfile' || 'infra/deployment/docker/backend.Dockerfile' }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha,scope=backend-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=backend-${{ matrix.variant }}

      - name: Summary
        run: |
          echo "Built image variant: ${{ matrix.variant }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Tags: ${{ steps.image.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
