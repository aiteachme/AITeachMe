# 这里只放项目级运行配置。
# 密钥、连接串、SMTP、对象存储、LangSmith 等环境相关参数放 `.env` / 进程环境变量。

# 三层模型策略:
#   reason  – 推理模型 (深度推理、规划) — 留空则回退到 primary
#   primary – 常用模型 (教学、出题、批改、对话)
#   light   – 轻量模型 (批量抽取、分类、摘要) — 留空则回退到 primary
models:
  reason: ""
  primary: qwen-plus-latest
  light: ""
  
  extract: ""
  ocr: ""
  embedding: text-embedding-v4
  image_generation: ""
  mermaid_generation: qwen-plus-latest

files:
  max_upload_size_mb: 50

chat:
  history_turns: 10

planner:
  default_digest_mode: sprint
  default_tone: encouraging
  allow_external_search: true

  sprint:
    min_chapters: 3
    max_chapters: 6
    target_length: 3000-5000字

  systematic:
    min_chapters: 5
    max_chapters: 12
    target_length: 10000-15000字

docgen:
  max_parallel_chapters: 20
  io_parallelism: 20
  max_research_queries: 3

ingest:
  parse_concurrency: 5
  parser_timeout_s: 90

rag:
  top_k: 5
  similarity_threshold: 0.3
  rerank_model: ""
  rerank_top_k: 3

search:
  max_results_per_query: 5
  scrape_timeout_s: 20

web_search:
  retriever_profile: ""
  retrievers: ""

local_rag:
  priority: true
  min_results: 2

runtime:
  llm_concurrency_limit: 20
  default_token_budget: 4000

embedding:
  batch_size: 10
  batch_delay_s: 0.1

digest:
  timing_top_k: 5
  token_summary_enabled: true
  chapter_priors_timeout_ms: 0

knowledge_graph:
  extract_max_parallelism: 20

observability:
  llm_observability_enabled: true
  tracing_enabled: true
  llm_observability_max_records: 5000

safety:
  guardrails_enabled: true

cache:
  enabled: false
  ttl_s: 3600
  max_entries: 1000
