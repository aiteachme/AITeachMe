<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 300">
  <title id="title">AITeachMe Star guide</title>
  <desc id="desc">An animated README banner that guides visitors to star the AITeachMe repository.</desc>
  <style>
    :root {
      color-scheme: light;
    }

    .frame {
      fill: #f7fbff;
      stroke: #d6e4f0;
      stroke-width: 2;
    }

    .panel {
      fill: #ffffff;
      stroke: #d7e2ec;
      stroke-width: 1.5;
    }

    .ink {
      fill: #102033;
    }

    .muted {
      fill: #52657a;
    }

    .accent {
      fill: #0f8b8d;
    }

    .gold {
      fill: #f5b301;
    }

    .soft-gold {
      fill: #fff3bf;
    }

    .route-base {
      fill: none;
      stroke: #d8e7ec;
      stroke-width: 7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .route-active {
      fill: none;
      stroke: #0f8b8d;
      stroke-width: 7;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 600;
      stroke-dashoffset: 600;
      animation: route 4.8s ease-in-out infinite;
    }

    .node {
      fill: #ffffff;
      stroke: #0f8b8d;
      stroke-width: 3;
    }

    .node-1 { animation: nod 4.8s ease-in-out infinite; }
    .node-2 { animation: nod 4.8s ease-in-out 0.55s infinite; }
    .node-3 { animation: nod 4.8s ease-in-out 1.1s infinite; }
    .node-4 { animation: nod 4.8s ease-in-out 1.65s infinite; }
    .node-5 { animation: nod 4.8s ease-in-out 2.2s infinite; }

    .star-core {
      transform-box: fill-box;
      transform-origin: center;
      animation: star-pop 4.8s cubic-bezier(.2,.8,.2,1) infinite;
    }

    .cursor {
      transform-box: fill-box;
      transform-origin: 20% 20%;
      animation: cursor-move 4.8s cubic-bezier(.2,.8,.2,1) infinite;
    }

    .spark {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation: sparkle 4.8s ease-in-out infinite;
    }

    .spark-2 { animation-delay: .22s; }
    .spark-3 { animation-delay: .44s; }

    .github-bar {
      fill: #101820;
    }

    .github-pill {
      fill: #fff8dc;
      stroke: #f0c94d;
      stroke-width: 2;
    }

    .github-pill-shadow {
      fill: #e8eef4;
    }

    .badge {
      fill: #e9f7f7;
      stroke: #b8dddd;
      stroke-width: 1.2;
    }

    .button-label {
      font: 700 20px "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      letter-spacing: 0;
    }

    .headline {
      font: 800 36px "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      letter-spacing: 0;
    }

    .subhead {
      font: 500 17px "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      letter-spacing: 0;
    }

    .step-label {
      font: 700 15px "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      letter-spacing: 0;
    }

    .small {
      font: 600 13px "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      letter-spacing: 0;
    }

    @keyframes route {
      0%, 12% { stroke-dashoffset: 600; }
      56%, 76% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -600; }
    }

    @keyframes nod {
      0%, 18%, 100% { transform: scale(1); filter: none; }
      28%, 46% { transform: scale(1.12); filter: drop-shadow(0 5px 8px rgba(15, 139, 141, .25)); }
      58% { transform: scale(1); filter: none; }
    }

    @keyframes star-pop {
      0%, 45%, 100% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(245, 179, 1, 0)); }
      58%, 72% { transform: scale(1.2); filter: drop-shadow(0 8px 14px rgba(245, 179, 1, .45)); }
      82% { transform: scale(1.06); filter: drop-shadow(0 4px 10px rgba(245, 179, 1, .24)); }
    }

    @keyframes cursor-move {
      0%, 28% { transform: translate(-180px, 62px) rotate(-9deg); opacity: 0; }
      36% { opacity: 1; }
      58%, 74% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
      82%, 100% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
    }

    @keyframes sparkle {
      0%, 52%, 100% { opacity: 0; transform: scale(.5); }
      62% { opacity: 1; transform: scale(1.08); }
      74% { opacity: .15; transform: scale(.82); }
    }

    @media (prefers-reduced-motion: reduce) {
      .route-active,
      .node-1,
      .node-2,
      .node-3,
      .node-4,
      .node-5,
      .star-core,
      .cursor,
      .spark {
        animation: none !important;
      }

      .route-active {
        stroke-dashoffset: 0;
      }

      .spark {
        opacity: 1;
      }
    }
  </style>

  <rect class="frame" x="8" y="8" width="944" height="284" rx="28" />
  <path fill="#eaf5f8" d="M8 206 C148 168 249 222 358 198 C499 167 542 75 686 89 C790 99 862 154 952 128 L952 292 L8 292 Z" />
  <path fill="#fff8dc" d="M8 236 C126 209 261 248 383 229 C530 206 604 129 751 148 C831 159 891 199 952 187 L952 292 L8 292 Z" opacity=".72" />

  <g transform="translate(42 34)">
    <rect class="panel" x="0" y="0" width="550" height="214" rx="20" />
    <rect class="badge" x="28" y="26" width="156" height="32" rx="16" />
    <circle class="accent" cx="48" cy="42" r="6" />
    <text class="small accent" x="62" y="47">Open Source Learning AI</text>

    <text class="headline ink" x="28" y="98">让更多人看见 AITeachMe</text>
    <text class="subhead muted" x="30" y="130">如果它帮你把资料变成可问、可测、可追踪的学习空间，</text>
    <text class="subhead muted" x="30" y="156">顺手点亮右上角 Star，就是对项目最直接的支持。</text>

    <g transform="translate(30 178)">
      <path class="route-base" d="M8 34 C92 0 154 68 238 34 S398 6 492 34" />
      <path class="route-active" d="M8 34 C92 0 154 68 238 34 S398 6 492 34" />

      <g class="node-1" transform="translate(8 34)">
        <circle class="node" r="16" />
        <path class="accent" d="M-7 -7 H7 V-3 H-7 Z M-7 -1 H7 V3 H-7 Z M-7 5 H2 V9 H-7 Z" />
      </g>
      <g class="node-2" transform="translate(126 29)">
        <circle class="node" r="16" />
        <path class="accent" d="M-8 -2 L0 -9 L8 -2 L4 -2 L4 8 H-4 V-2 Z" />
      </g>
      <g class="node-3" transform="translate(246 34)">
        <circle class="node" r="16" />
        <path class="accent" d="M-8 -8 H8 V5 H2 L-3 10 V5 H-8 Z" />
      </g>
      <g class="node-4" transform="translate(370 29)">
        <circle class="node" r="16" />
        <path class="accent" d="M-6 -8 H6 A4 4 0 0 1 10 -4 V6 A4 4 0 0 1 6 10 H-6 A4 4 0 0 1 -10 6 V-4 A4 4 0 0 1 -6 -8 Z M-4 -2 H4 V2 H-4 Z M-4 4 H2 V7 H-4 Z" />
      </g>
      <g class="node-5" transform="translate(492 34)">
        <circle class="node" r="16" />
        <path class="accent" d="M0 -9 L3 -3 L10 -2 L5 3 L6 10 L0 6 L-6 10 L-5 3 L-10 -2 L-3 -3 Z" />
      </g>

      <text class="step-label muted" x="-6" y="74">资料</text>
      <text class="step-label muted" x="108" y="74">文档</text>
      <text class="step-label muted" x="226" y="74">伴读</text>
      <text class="step-label muted" x="350" y="74">诊断</text>
      <text class="step-label muted" x="474" y="74">Star</text>
    </g>
  </g>

  <g transform="translate(632 44)">
    <rect class="github-bar" x="0" y="0" width="270" height="180" rx="22" />
    <circle fill="#f76565" cx="28" cy="28" r="6" />
    <circle fill="#f5b301" cx="48" cy="28" r="6" />
    <circle fill="#29c36a" cx="68" cy="28" r="6" />
    <rect fill="#1c2b38" x="24" y="55" width="222" height="96" rx="14" />
    <rect fill="#2b3b49" x="44" y="76" width="92" height="10" rx="5" />
    <rect fill="#2b3b49" x="44" y="98" width="158" height="10" rx="5" />
    <rect fill="#2b3b49" x="44" y="120" width="124" height="10" rx="5" />

    <rect class="github-pill-shadow" x="128" y="21" width="112" height="43" rx="21.5" opacity=".25" />
    <rect class="github-pill" x="122" y="16" width="112" height="43" rx="21.5" />
    <g class="star-core" transform="translate(145 38)">
      <path class="gold" d="M0 -13 L3.9 -4.8 L12.9 -3.7 L6.3 2.6 L8.1 11.6 L0 7.1 L-8.1 11.6 L-6.3 2.6 L-12.9 -3.7 L-3.9 -4.8 Z" />
    </g>
    <text class="button-label ink" x="166" y="45">Star</text>

    <g class="spark" transform="translate(226 16)">
      <path class="gold" d="M0 -10 L2.4 -2.4 L10 0 L2.4 2.4 L0 10 L-2.4 2.4 L-10 0 L-2.4 -2.4 Z" />
    </g>
    <g class="spark spark-2" transform="translate(118 18)">
      <path class="gold" d="M0 -7 L1.8 -1.8 L7 0 L1.8 1.8 L0 7 L-1.8 1.8 L-7 0 L-1.8 -1.8 Z" />
    </g>
    <g class="spark spark-3" transform="translate(214 68)">
      <path class="gold" d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" />
    </g>

    <g class="cursor" transform="translate(210 95)">
      <path fill="#102033" d="M0 0 L0 50 L13 39 L22 60 L34 55 L25 35 L42 35 Z" />
      <path fill="#ffffff" d="M5 12 L5 39 L13 32 L23 53 L27 51 L17 29 L30 29 Z" />
    </g>
  </g>

  <g transform="translate(650 244)">
    <rect class="soft-gold" x="0" y="0" width="238" height="34" rx="17" />
    <path class="gold" d="M21 9 L24.2 15.5 L31.4 16.5 L26.2 21.6 L27.5 28.8 L21 25.4 L14.5 28.8 L15.8 21.6 L10.6 16.5 L17.8 15.5 Z" />
    <text class="small ink" x="42" y="23">点亮 Star，跟进下一次更新</text>
  </g>
</svg>
